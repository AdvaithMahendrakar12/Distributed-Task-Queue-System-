apiVersion: 1

providers:
  - name: 'task-queue'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Dashboards live next to this file; Grafana only picks up .json here.
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
